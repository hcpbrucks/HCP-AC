<svg xmlns="http://www.w3.org/2000/svg" width="980" height="170" viewBox="0 0 980 170" fill="none">
  <style>
    :root{
      --bg:#f6f8fa;
      --panel:#ffffff;
      --line:#d0d7de;
      --soft:#eef2f7;
      --text:#111827;
      --muted:#6b7280;
      --bar:#111111;
    }
    @media (prefers-color-scheme: dark) {
      :root{
        --bg:#0d1117;
        --panel:#11161d;
        --line:#30363d;
        --soft:#161b22;
        --text:#f0f6fc;
        --muted:#9da7b3;
        --bar:#ffffff;
      }
    }
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
    .prog{animation:prog 4.2s infinite}
    .pulse{animation:pulse 1.6s infinite ease-in-out}
    .d1{animation:dots 1.2s infinite}
    .d2{animation:dots 1.2s .2s infinite}
    .d3{animation:dots 1.2s .4s infinite}
    @keyframes prog{0%{width:56px}60%{width:514px}100%{width:514px}}
    @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
    @keyframes dots{0%,80%,100%{opacity:.35}40%{opacity:1}}
  </style>

  <rect width="980" height="170" rx="22" fill="var(--bg)"/>
  <rect x="1" y="1" width="978" height="168" rx="21" stroke="var(--line)"/>

  <rect x="32" y="28" width="916" height="114" rx="18" fill="var(--panel)" stroke="var(--line)"/>

  <text x="58" y="58" font-size="15" font-weight="700" fill="var(--text)">INITIALIZING PUBLIC PACKAGE REQUEST</text>
  <text x="58" y="83" font-size="13" font-weight="600" fill="var(--muted)">Checking license route</text>
  <circle class="d1" cx="239" cy="78" r="3.5" fill="var(--muted)"/>
  <circle class="d2" cx="253" cy="78" r="3.5" fill="var(--muted)"/>
  <circle class="d3" cx="267" cy="78" r="3.5" fill="var(--muted)"/>

  <rect x="58" y="100" width="540" height="18" rx="9" fill="var(--soft)" stroke="var(--line)"/>
  <rect class="prog" x="58" y="100" width="56" height="18" rx="9" fill="var(--bar)"/>

  <circle class="pulse" cx="640" cy="109" r="8" fill="var(--bar)"/>
  <text x="658" y="104" font-size="12" font-weight="700" fill="var(--text)">Protected builds are delivered</text>
  <text x="658" y="121" font-size="12" font-weight="700" fill="var(--text)">through the official HCP panel.</text>
</svg>
