<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none">
  <style>
    :root{
      --bg:#f6f8fa;
      --panel:#ffffff;
      --line:rgba(31,35,40,0.10);
      --text:#111827;
      --muted:#6b7280;
      --soft:#eef2f7;
      --accent:#111111;
      --glow:rgba(17,17,17,0.16);
    }
    @media (prefers-color-scheme: dark) {
      :root{
        --bg:#0d1117;
        --panel:#11161d;
        --line:rgba(240,246,252,0.10);
        --text:#f5f7fb;
        --muted:#9aa4b2;
        --soft:#0f141a;
        --accent:#ffffff;
        --glow:rgba(255,255,255,0.18);
      }
    }
    .pulse1 { animation: pulse 1.8s infinite ease-in-out; transform-origin:center; }
    .pulse2 { animation: pulse 2.2s infinite ease-in-out; transform-origin:center; }
    .pulse3 { animation: pulse 2.6s infinite ease-in-out; transform-origin:center; }
    .beam { animation: scan 5s infinite linear; }
    .float1 { animation: floaty 4s infinite ease-in-out; }
    .float2 { animation: floaty 4.8s infinite ease-in-out; }
    .float3 { animation: floaty 5.6s infinite ease-in-out; }
    @keyframes pulse { 0%,100%{opacity:.45} 50%{opacity:1} }
    @keyframes scan { 0%{transform:translateX(-260px)} 100%{transform:translateX(1260px)} }
    @keyframes floaty { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-3px)} }
    text{font-family:Inter,Segoe UI,Arial,sans-serif}
  </style>

  <rect width="1280" height="320" rx="28" fill="var(--bg)"/>
  <rect x="1" y="1" width="1278" height="318" rx="27" stroke="var(--line)"/>

  <g opacity="0.9">
    <rect x="36" y="34" width="1208" height="252" rx="22" fill="var(--panel)"/>
    <rect x="36.5" y="34.5" width="1207" height="251" rx="21.5" stroke="var(--line)"/>
  </g>

  <g opacity="0.45">
    <path d="M72 91H1208" stroke="var(--line)"/>
    <path d="M72 140H1208" stroke="var(--line)"/>
    <path d="M72 189H1208" stroke="var(--line)"/>
    <path d="M72 238H1208" stroke="var(--line)"/>
    <path d="M244 66V254" stroke="var(--line)"/>
    <path d="M418 66V254" stroke="var(--line)"/>
    <path d="M592 66V254" stroke="var(--line)"/>
    <path d="M766 66V254" stroke="var(--line)"/>
    <path d="M940 66V254" stroke="var(--line)"/>
    <path d="M1114 66V254" stroke="var(--line)"/>
  </g>

  <g>
    <rect x="80" y="92" width="420" height="138" rx="18" fill="var(--soft)" stroke="var(--line)"/>
    <g class="beam">
      <rect x="0" y="86" width="180" height="150" rx="24" fill="url(#beamGradient)" opacity="0.55"/>
    </g>

    <g class="float1">
      <text x="112" y="141" font-size="84" font-weight="700" fill="var(--text)" letter-spacing="2">HCP</text>
      <path d="M332 170L395 70" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
      <text x="418" y="141" font-size="84" font-weight="700" fill="var(--text)" letter-spacing="2">AC</text>
    </g>
    <text x="112" y="188" font-size="14" font-weight="600" fill="var(--muted)" letter-spacing="1.6">FIVEM SECURITY PLATFORM</text>
  </g>

  <g class="float2">
    <rect x="560" y="94" width="154" height="54" rx="16" fill="var(--soft)" stroke="var(--line)"/>
    <circle class="pulse1" cx="590" cy="121" r="7" fill="var(--accent)"/>
    <text x="610" y="126" font-size="14" font-weight="700" fill="var(--text)">LIVE PROTECTION</text>
  </g>

  <g class="float3">
    <rect x="736" y="94" width="174" height="54" rx="16" fill="var(--soft)" stroke="var(--line)"/>
    <circle class="pulse2" cx="766" cy="121" r="7" fill="var(--accent)"/>
    <text x="786" y="126" font-size="14" font-weight="700" fill="var(--text)">24/7 MONITORING</text>
  </g>

  <g class="float1">
    <rect x="932" y="94" width="140" height="54" rx="16" fill="var(--soft)" stroke="var(--line)"/>
    <circle class="pulse3" cx="962" cy="121" r="7" fill="var(--accent)"/>
    <text x="982" y="126" font-size="14" font-weight="700" fill="var(--text)">WEB WATCH</text>
  </g>

  <g class="float2">
    <rect x="560" y="164" width="158" height="54" rx="16" fill="var(--soft)" stroke="var(--line)"/>
    <circle class="pulse2" cx="590" cy="191" r="7" fill="var(--accent)"/>
    <text x="610" y="196" font-size="14" font-weight="700" fill="var(--text)">TRUST SCORE</text>
  </g>

  <g class="float3">
    <rect x="740" y="164" width="170" height="54" rx="16" fill="var(--soft)" stroke="var(--line)"/>
    <circle class="pulse1" cx="770" cy="191" r="7" fill="var(--accent)"/>
    <text x="790" y="196" font-size="14" font-weight="700" fill="var(--text)">ON-SCREEN ANALYSIS</text>
  </g>

  <g class="float1">
    <rect x="932" y="164" width="154" height="54" rx="16" fill="var(--soft)" stroke="var(--line)"/>
    <circle class="pulse3" cx="962" cy="191" r="7" fill="var(--accent)"/>
    <text x="982" y="196" font-size="14" font-weight="700" fill="var(--text)">PC ANALYSIS</text>
  </g>

  <text x="80" y="64" font-size="13" font-weight="700" fill="var(--muted)" letter-spacing="1.8">CONNECTED PRODUCT OVERVIEW</text>
  <text x="560" y="69" font-size="15" font-weight="600" fill="var(--muted)">Built for player review, evidence and live team workflows.</text>

  <defs>
    <linearGradient id="beamGradient" x1="0" y1="160" x2="180" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="transparent"/>
      <stop offset="0.5" stop-color="var(--glow)"/>
      <stop offset="1" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>
